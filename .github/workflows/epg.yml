name: Update EPG

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country codes"
        required: false
        default: "jp,us,uk,kr,cn,hk,at,au,fr,ch,il"
      days:
        description: "Days to grab"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      COUNTRIES: ${{ inputs.countries || 'jp,us,uk,kr,cn,hk,at,au,fr,ch,il' }}
      DAYS: ${{ inputs.days || '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build channel list
        run: |
          mkdir -p out
          node scripts/epg.mjs init out/state.json out/pass1.xml

      - name: Fetch iptv-org/epg
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg
          cd epg
          npm install --no-audit --no-fund

      - name: Grab guide (with fallback sources)
        run: |
          inputs=()
          for pass in 1 2 3 4; do
            if ! grep -q '<channel ' "out/pass$pass.xml"; then
              echo "No channels left for pass $pass"
              break
            fi
            echo "::group::pass $pass"
            (cd epg && npm run grab --- \
              --channels="$GITHUB_WORKSPACE/out/pass$pass.xml" \
              --output="$GITHUB_WORKSPACE/out/guide$pass.xml" \
              --days="$DAYS" \
              --maxConnections=10 \
              --timeout=20000) || echo "::warning::grab pass $pass exited with an error"
            echo "::endgroup::"
            inputs+=("out/guide$pass.xml")
            node scripts/epg.mjs next out/state.json "out/guide$pass.xml" "out/pass$((pass + 1)).xml" "pass $((pass + 1))"
          done
          node scripts/epg.mjs merge out/guide.xml "${inputs[@]}"
          gzip -9 -k -f out/guide.xml

      - name: Check output
        run: |
          ls -la out
          channels=$(grep -c '<channel ' out/guide.xml || true)
          programmes=$(grep -c '<programme ' out/guide.xml || true)
          echo "channels with programmes: $channels, programmes: $programmes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$programmes" -gt 0

      - name: Publish to release "epg"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view epg >/dev/null 2>&1; then
            gh release create epg --title "EPG" --notes "Daily XMLTV guide. Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/epg/guide.xml.gz" --latest
          fi
          cp out/pass1.xml out/channels.xml
          gh release upload epg out/guide.xml.gz out/channels.xml --clobber
          gh release edit epg --notes "Daily XMLTV guide (countries: ${COUNTRIES}, days: ${DAYS}). Updated $(date -u +%Y-%m-%dT%H:%MZ). Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/epg/guide.xml.gz"
